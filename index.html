<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>zenin</title>

    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600&display=swap" rel="stylesheet">
    
    <style>
        /* RESET BÁSICO */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Poppins', sans-serif;
        }

        body {
            background-color: #000;
            color: #fff;
            overflow: hidden;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
        }

        /* TELA DE ENTRADA */
        #enter-screen {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background-color: rgba(0, 0, 0, 0.95);
            display: flex;
            justify-content: center;
            align-items: center;
            z-index: 100;
            cursor: pointer;
            transition: opacity 0.5s ease;
        }

        #enter-screen p {
            font-size: 1.2rem;
            letter-spacing: 2px;
            animation: pulse 1.5s infinite;
        }

        @keyframes pulse {
            0% {
                opacity: 0.5;
            }

            50% {
                opacity: 1;
            }

            100% {
                opacity: 0.5;
            }
        }

        /* VÍDEO DE FUNDO */
        #bg-video {
            position: fixed;
            top: 50%;
            left: 50%;
            min-width: 100%;
            min-height: 100%;
            width: auto;
            height: auto;
            transform: translate(-50%, -50%);
            z-index: -1;
            object-fit: cover;
            filter: brightness(0.4);
        }

        /* CONTEÚDO PRINCIPAL */
        #main-content {
            opacity: 0;
            pointer-events: none;
            transition: opacity 1s ease;
            z-index: 10;
        }

        /* CARTÃO */
        .card {
            background: linear-gradient(
                135deg,
                rgba(105, 30, 160, 0.7) 0%,
                rgba(25, 10, 45, 0.85) 100%
            );
            backdrop-filter: blur(10px);
            -webkit-backdrop-filter: blur(10px);
            border: 1px solid rgba(255, 255, 255, 0.05);
            border-radius: 20px;
            width: 320px;
            padding: 40px 20px 50px;
            display: flex;
            flex-direction: column;
            align-items: center;
            position: relative;
            box-shadow: 0 0 40px rgba(0, 0, 0, 0.8);
        }

        /* FOTO DE PERFIL */
        .profile-pic {
            width: 110px;
            height: 110px;
            border-radius: 50%;
            object-fit: cover;
            margin-bottom: 15px;
            border: 2px solid rgba(255, 255, 255, 0.1);
        }

        /* TEXTOS */
        .username {
            font-size: 1.8rem;
            font-weight: 600;
            text-shadow: 0 0 15px rgba(255, 255, 255, 0.8);
            margin-bottom: 5px;
            letter-spacing: 1px;
        }

        .subtitle {
            font-size: 0.9rem;
            color: #d1d1d1;
            margin-bottom: 25px;
            letter-spacing: 0.5px;
            text-transform: uppercase;
        }

        /* BOTÕES SOCIAIS */
        .socials {
            display: flex;
            justify-content: center;
            flex-wrap: wrap;
            gap: 15px;
        }

        .social-icon {
            width: 45px;
            height: 45px;
            border: 2px solid transparent;
            background:
                linear-gradient(#000, #000) padding-box,
                linear-gradient(135deg, #b829ff, #4c1d95) border-box;
            border-radius: 10px;
            display: flex;
            justify-content: center;
            align-items: center;
            transition:
                transform 0.2s ease,
                filter 0.2s ease;
            text-decoration: none;
            overflow: hidden;
        }

        .social-icon:hover {
            transform: scale(1.1);
            filter: brightness(1.2);
        }

        .social-icon img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            border-radius: 8px;
        }

        /* CONTADOR DE VISUALIZAÇÕES */
        .views {
            position: absolute;
            bottom: 15px;
            left: 20px;
            display: flex;
            align-items: center;
            gap: 6px;
            font-size: 0.9rem;
            color: #fff;
            opacity: 0.8;
        }

        .eye-icon {
            width: 18px;
            height: 18px;
        }
    </style>
</head>

<body>

    <!-- TELA DE ENTRADA -->
    <div id="enter-screen" onclick="enterSite()">
        <p>click to enter...</p>
    </div>

    <!-- VÍDEO DE FUNDO -->
    <video id="bg-video" loop playsinline>
        <source src="edit.mp4" type="video/mp4">
    </video>

    <!-- CONTEÚDO PRINCIPAL -->
    <div id="main-content">
        <div class="card">

            <!-- FOTO DE PERFIL -->
            <img src="perfil.jpg" alt="Perfil" class="profile-pic">
            
            <h1 class="username">RAJIN ZENIN</h1>
            <p class="subtitle">SEJA BEM-VINDOS</p>

            <div class="socials">

                <!-- BOTÃO DO DISCORD -->
                <a
                    href="https://discord.gg/rMWG9DHTzg"
                    class="social-icon"
                    target="_blank"
                    rel="noopener noreferrer"
                    aria-label="Discord"
                >
                    <img src="discord.png" alt="Discord">
                </a>

                <!-- BOTÃO DO TIKTOK -->
                <a
                    href="https://tiktok.com/@fushiiguurotojii"
                    class="social-icon"
                    target="_blank"
                    rel="noopener noreferrer"
                    aria-label="TikTok"
                >
                    <img src="tiktok.png" alt="TikTok">
                </a>

                <!-- NOVO BOTÃO: TROQUE O LINK E O NOME DO ÍCONE -->
                <a
                    href="https://www.tojigamehub.app"
                    class="social-icon"
                    target="_blank"
                    rel="noopener noreferrer"
                    aria-label="tojigamehub"
                >
                    <!-- Coloque aqui o nome da foto/ícone -->
                    <img src="tojigame.png" alt="tojigamehub">
                </a>

            </div>

            <!-- CONTADOR DE VISUALIZAÇÕES -->
            <div class="views">
                <svg
                    viewBox="0 0 24 24"
                    fill="none"
                    stroke="currentColor"
                    stroke-width="2"
                    stroke-linecap="round"
                    stroke-linejoin="round"
                    class="eye-icon"
                >
                    <path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"></path>
                    <circle cx="12" cy="12" r="3"></circle>
                </svg>

                <span>168</span>
            </div>

        </div>
    </div>

    <script>
        function enterSite() {
            const enterScreen = document.getElementById('enter-screen');
            const mainContent = document.getElementById('main-content');
            const video = document.getElementById('bg-video');

            enterScreen.style.opacity = '0';

            setTimeout(() => {
                enterScreen.style.display = 'none';
            }, 500);
            
            mainContent.style.opacity = '1';
            mainContent.style.pointerEvents = 'all';

            video.volume = 1.0;
            video.play();
        }
    </script>

</body>
</html>
